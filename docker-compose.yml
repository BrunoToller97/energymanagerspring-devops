services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: ${APP_IMAGE:-energymanagerspring:local}

    container_name: energymanagerspring-${ENVIRONMENT:-local}

    ports:
      - "${APP_PORT:-8080}:8080"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-default}

      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      SHOW_SQL: ${SHOW_SQL:-false}

      LOG_FILE: /app/logs/energymanagerspring.log

    volumes:
      - energy-logs:/app/logs

    networks:
      - energy-network

    restart: unless-stopped


volumes:
  energy-logs:


networks:
  energy-network:
    driver: bridge